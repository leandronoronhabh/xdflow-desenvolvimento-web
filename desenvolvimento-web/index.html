<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>XDFLOW — Desenvolvimento web premium</title>
    <link rel="icon" type="image/webp" href="assets/logo-white.webp" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #071912;
      }
    </style>
    <script>
      (() => {
        const variant = window.matchMedia("(max-width: 600px)").matches
          ? "mobile.html"
          : "desktop.html";

        fetch(variant, { cache: "no-cache" })
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          })
          .then((html) => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(() => {
            window.location.replace(variant);
          });
      })();
    </script>
  </head>
  <body></body>
</html>
